name: Twenty authenticated accounts QA
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate fixture without logging in
        type: boolean
        default: true
      accounts_verified:
        description: Twenty distinct existing test accounts are authorized
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ecopulse-authenticated-concurrency
  cancel-in-progress: false
jobs:
  concurrency:
    if: github.repository == 'hackwtg122/EcoPulse' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/qa/private-qa-policy.test.mjs scripts/qa/concurrency-20.test.mjs scripts/qa/concurrency-ticket.test.mjs
      - name: Validate fixture without disclosing credentials or creating profiles
        run: node scripts/qa/concurrency-ticket.mjs --validate-only
        env:
          CONCURRENCY_QA_IDENTITIES: ${{ secrets.CONCURRENCY_QA_IDENTITIES }}
      - if: ${{ !inputs.validate_only && inputs.accounts_verified }}
        run: npm ci --prefix scripts/qa --ignore-scripts --no-audit --no-fund
      - name: Five minutes after all twenty identities are verified
        if: ${{ !inputs.validate_only && inputs.accounts_verified }}
        run: node scripts/qa/concurrency-ticket.mjs
        env:
          CONCURRENCY_AUTHORIZED: 'true'
          CONCURRENCY_DURATION_MS: '300000'
          CONCURRENCY_QA_IDENTITIES: ${{ secrets.CONCURRENCY_QA_IDENTITIES }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          PROD_QA_MODULES_DIR: ${{ github.workspace }}/scripts/qa/node_modules
          CHROME_PATH: /usr/bin/google-chrome
