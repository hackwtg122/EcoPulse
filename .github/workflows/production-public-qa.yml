
name: Production functional QA

on:
  workflow_dispatch:
    inputs:
      neon_readonly:
        description: Consultar Neon neondb con el secreto NEON_READONLY_URL autorizado
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ecopulse-production
  cancel-in-progress: false

jobs:
  role-policy:
    if: github.repository == 'hackwtg122/EcoPulse' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Pure security policy tests (no database or provider calls)
        run: node --experimental-strip-types --test artifacts/api-server/src/lib/pilotRoles.test.mjs
      - name: Provider configuration and mocked provider tests (no remote AI)
        run: node --experimental-strip-types --test artifacts/api-server/src/lib/aiProvider.test.mjs artifacts/api-server/src/lib/aiProviderConfig.test.mjs
      - name: Frontend API contracts (mocked HTTP)
        run: node --experimental-strip-types --test artifacts/eco-pulse/src/pilot-api.test.mjs
      - name: Inventory authorization, concurrency, rollback and client contracts (no remote writes)
        run: node --experimental-strip-types --test artifacts/api-server/src/lib/rewardInventory.test.mjs artifacts/eco-pulse/src/reward-inventory.test.mjs

  deploy-render:
    needs: role-policy
    if: github.repository == 'hackwtg122/EcoPulse' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Deploy approved commit to the existing official Render service
        run: node scripts/qa/deploy-render.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  guide-storage-schema:
    needs: deploy-render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned read-only schema driver
        run: npm install --prefix "$RUNNER_TEMP/ecopulse-guide-qa" --no-audit --no-fund --ignore-scripts pg@8.22.0
      - name: Verify the actual Render database and owner isolation without records
        run: node --experimental-strip-types scripts/qa/production-guide-database.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PROD_QA_PG_MODULE: ${{ runner.temp }}/ecopulse-guide-qa/node_modules/pg/lib/index.js

  reward-inventory-schema:
    needs: deploy-render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned read-only schema driver
        run: npm install --prefix "$RUNNER_TEMP/ecopulse-inventory-qa" --no-audit --no-fund --ignore-scripts pg@8.22.0
      - name: Verify inventory ledger and runtime permissions without business writes
        run: node --experimental-strip-types scripts/qa/production-reward-inventory.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PROD_QA_PG_MODULE: ${{ runner.temp }}/ecopulse-inventory-qa/node_modules/pg/lib/index.js

  public-browser:
    needs: public-api
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/qa/package-lock.json
      - name: Install pinned audit tools (npm cache)
        run: npm ci --prefix scripts/qa --no-audit --no-fund --ignore-scripts
      - name: Public browser smoke against production URLs
        run: node scripts/qa/production-public.mjs
        env:
          PROD_QA_MODULES_DIR: ${{ github.workspace }}/scripts/qa/node_modules
          CHROME_PATH: /usr/bin/google-chrome

  public-api:
    needs: deploy-render
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Production API security and deployed SHA (read only)
        run: node scripts/qa/production-api.mjs
        env:
          EXPECTED_PRODUCTION_SHA: ${{ github.sha }}

  neon-readonly:
    if: github.repository == 'hackwtg122/EcoPulse' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.neon_readonly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned read-only query driver in runner temp
        run: npm install --prefix "$RUNNER_TEMP/ecopulse-neon-qa" --no-audit --no-fund --ignore-scripts pg@8.22.0
      - name: Read-only production database inventory
        run: node scripts/neon/verify-production-readonly.mjs
        env:
          NEON_READONLY_URL: ${{ secrets.NEON_READONLY_URL }}
          PROD_QA_PG_MODULE: ${{ runner.temp }}/ecopulse-neon-qa/node_modules/pg/lib/index.js
