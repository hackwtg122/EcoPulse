name: EcoPulse admin integration check

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/lib/adminInitialCatalog*"
      - "artifacts/api-server/src/routes/pilot.ts"
      - "artifacts/api-server/src/lib/deliveryCoordinationPlans.ts"
      - "artifacts/api-server/src/lib/deliveryCoordinationPlans.test.mjs"
      - "artifacts/eco-pulse/src/delivery-panel.tsx"
      - "artifacts/eco-pulse/src/pilot-api.ts"
      - "artifacts/eco-pulse/src/operational-readiness-panel.tsx"
      - "artifacts/eco-pulse/src/App.tsx"
      - "artifacts/eco-pulse/src/rewards-panel.tsx"
      - ".github/workflows/pr-admin-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test admin initialization without accessing production
        run: node --experimental-strip-types --test artifacts/api-server/src/lib/adminInitialCatalog.test.mjs
      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Check types and build
        run: pnpm run build
